<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>傳訊</title>
  <style>
    :root {
      --bg-color: #f5f6f8;
      --card-bg: #ffffff;
      --primary: #4a72ff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --chat-user-bg: #4a72ff;
      --chat-user-text: #ffffff;
      --chat-bot-bg: #ffffff;
      --chat-bot-text: #1f2937;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    /* 頂部導航欄 */
    .header {
      height: 60px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .header-info .name {
      font-weight: 600;
      font-size: 16px;
    }

    .header-info .status {
      font-size: 12px;
      color: #10b981;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-sub);
    }

    /* 聊天紀錄區域 */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .message.user .bubble {
      background: var(--chat-user-bg);
      color: var(--chat-user-text);
      border-bottom-right-radius: 4px;
    }

    .message.bot .bubble {
      background: var(--chat-bot-bg);
      color: var(--chat-bot-text);
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* 卡片訊息（請回答） */
    .qa-card {
      background: #fff;
      border: 1px solid var(--primary);
      border-radius: 12px;
      padding: 12px;
      width: 240px;
      box-shadow: 0 4px 12px rgba(74, 114, 255, 0.15);
    }

    .qa-card-title {
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 6px;
      font-size: 14px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 4px;
    }

    .qa-card-content {
      font-size: 14px;
      margin-bottom: 10px;
      color: #333;
    }

    .qa-card-btn {
      width: 100%;
      padding: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .qa-result {
      margin-top: 8px;
      padding: 6px;
      background: #f0fdf4;
      color: #15803d;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      font-size: 14px;
    }

    /* 底部輸入區域 */
    .input-area {
      background: var(--card-bg);
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      height: 40px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 0 16px;
      font-size: 14px;
      outline: none;
      background: #f9fafb;
    }

    .send-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Modal 通用樣式 */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-height: 85%;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      overflow-y: auto;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-header h3 {
      font-size: 18px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-sub);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
    }

    .tab-container {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .search-result-item {
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
    }

    .search-result-item .date {
      color: var(--text-sub);
      font-size: 11px;
    }

    .range-value {
      text-align: right;
      font-size: 12px;
      color: var(--primary);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 頂部導航 -->
    <header class="header">
      <div class="header-user">
        <img class="avatar" src="https://via.placeholder.com/40" id="botAvatar" alt="Avatar">
        <div class="header-info">
          <div class="name" id="botName">夢角</div>
          <div class="status">● 在線</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openModal('settingsModal')" title="聊天設置">⚙️</button>
        <button class="icon-btn" onclick="openModal('advancedModal')" title="高級功能">✨</button>
      </div>
    </header>

    <!-- 聊天訊息區 -->
    <main class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="bubble">我們的故事，始於此刻。</div>
        <div class="msg-time" id="initTime">10:00</div>
      </div>
    </main>

    <!-- 輸入區 -->
    <footer class="input-area">
      <input type="text" class="chat-input" id="messageInput" placeholder="傳送訊息..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMessage()">發送</button>
    </footer>

    <!-- 設置 Modal -->
    <div class="modal" id="settingsModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>聊天設置</h3>
          <button class="close-btn" onclick="closeModal('settingsModal')">&times;</button>
        </div>
        
        <div class="form-group">
          <label for="inputBotName">角色暱稱</label>
          <input type="text" id="inputBotName" class="form-control" value="夢角">
        </div>

        <!-- 修改點 A: 最長等待上限為 10 分鐘 (600秒) -->
        <div class="form-group">
          <label>回覆速度上限 (最長 10 分鐘)</label>
          <input type="range" id="replySpeedRange" min="1" max="600" value="5" class="form-control" oninput="updateSpeedLabel(this.value)">
          <div class="range-value" id="speedLabel">5 秒</div>
        </div>

        <button class="send-btn" style="width: 100%; border-radius: 8px;" onclick="saveSettings()">儲存設置</button>
      </div>
    </div>

    <!-- 高級功能 Modal -->
    <div class="modal" id="advancedModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>高級功能</h3>
          <button class="close-btn" onclick="closeModal('advancedModal')">&times;</button>
        </div>

        <!-- 功能分頁按鈕 -->
        <div class="tab-container">
          <button class="tab-btn active" onclick="switchTab('tab-search')">搜尋聊天內容</button>
          <button class="tab-btn" onclick="switchTab('tab-qa')">請回答 (抉擇)</button>
        </div>

        <!-- 修改點 B: 按日期搜尋聊天內容 -->
        <div id="tab-search" class="tab-page">
          <div class="form-group">
            <label>起始日期</label>
            <input type="date" id="searchStartDate" class="form-control">
          </div>
          <div class="form-group">
            <label>結束日期</label>
            <input type="date" id="searchEndDate" class="form-control">
          </div>
          <div class="form-group">
            <label>關鍵字 (可選)</label>
            <input type="text" id="searchKeyword" class="form-control" placeholder="輸入關鍵字">
          </div>
          <button class="send-btn" style="width: 100%; border-radius: 8px; margin-bottom: 12px;" onclick="executeSearch()">搜尋</button>
          
          <div id="searchResults" style="max-height: 200px; overflow-y: auto;">
            <!-- 搜尋結果顯示區 -->
          </div>
        </div>

        <!-- 修改點 C: 抉擇 -「請回答」卡片生成 -->
        <div id="tab-qa" class="tab-page" style="display: none;">
          <div class="form-group">
            <label>題目 / 問題描述</label>
            <input type="text" id="qaQuestion" class="form-control" placeholder="例如：今天晚餐吃什麼？">
          </div>
          <div class="form-group">
            <label>選項清單 (每行一個選項)</label>
            <textarea id="qaOptions" class="form-control" rows="4" placeholder="火鍋&#10;拉麵&#10;燒肉&#10;麥當勞"></textarea>
          </div>
          <button class="send-btn" style="width: 100%; border-radius: 8px;" onclick="sendQACard()">發送至聊天室並抽籤</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    // 聊天紀錄資料庫 (模擬記憶體儲存)
    let messageList = [
      { sender: 'bot', text: '我們的故事，始於此刻。', timestamp: new Date() }
    ];

    document.getElementById('initTime').innerText = formatTime(new Date());

    // Modal 控制
    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // 分頁切換
    function switchTab(tabId) {
      document.querySelectorAll('.tab-page').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      event.target.classList.add('active');
    }

    // 修改點 A: 10分鐘上限邏輯處理
    function updateSpeedLabel(val) {
      const minutes = Math.floor(val / 60);
      const seconds = val % 60;
      let text = '';
      if (minutes > 0) text += `${minutes} 分 `;
      if (seconds > 0 || minutes === 0) text += `${seconds} 秒`;
      document.getElementById('speedLabel').innerText = text;
    }

    function saveSettings() {
      const name = document.getElementById('inputBotName').value.trim();
      if(name) {
        document.getElementById('botName').innerText = name;
      }
      closeModal('settingsModal');
    }

    // 時間格式化工具 (HH:MM)
    function formatTime(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    // 發送一般訊息
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      addMessageToUI('user', text, now);
      messageList.push({ sender: 'user', text: text, timestamp: now });

      input.value = '';

      // 模擬夢角自動回覆 (延遲根據設定)
      const delaySec = parseInt(document.getElementById('replySpeedRange').value) || 3;
      setTimeout(() => {
        const botMsg = `收到你的訊息了：「${text}」`;
        const botTime = new Date();
        addMessageToUI('bot', botMsg, botTime);
        messageList.push({ sender: 'bot', text: botMsg, timestamp: botTime });
      }, delaySec * 1000);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function addMessageToUI(sender, text, date) {
      const container = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      
      msgDiv.innerHTML = `
        <div class="bubble">${escapeHTML(text)}</div>
        <div class="msg-time">${formatTime(date)}</div>
      `;
      
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    // 修改點 B: 按日期 (dd/mm/yyyy 格式化輸入) 搜尋聊天內容
    function executeSearch() {
      const startVal = document.getElementById('searchStartDate').value;
      const endVal = document.getElementById('searchEndDate').value;
      const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();

      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '';

      if (!startVal || !endVal) {
        alert('請選擇完整的搜尋起始與結束日期！');
        return;
      }

      const startDate = new Date(startVal + 'T00:00:00');
      const endDate = new Date(endVal + 'T23:59:59');

      const filtered = messageList.filter(msg => {
        const msgDate = new Date(msg.timestamp);
        const inDateRange = msgDate >= startDate && msgDate <= endDate;
        const matchKeyword = keyword ? msg.text.toLowerCase().includes(keyword) : true;
        return inDateRange && matchKeyword;
      });

      if (filtered.length === 0) {
        resultsContainer.innerHTML = '<div style="color:#888; font-size:13px; text-align:center; padding:10px;">未搜尋到相關紀錄</div>';
        return;
      }

      filtered.forEach(msg => {
        const item = document.createElement('div');
        item.className = 'search-result-item';
        const d = new Date(msg.timestamp);
        const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${formatTime(d)}`;
        item.innerHTML = `
          <div><strong>${msg.sender === 'user' ? '我' : '夢角'}:</strong> ${escapeHTML(msg.text)}</div>
          <div class="date">${dateStr}</div>
        `;
        resultsContainer.appendChild(item);
      });
    }

    // 修改點 C: 發送「請回答」卡片到聊天室並進行抽籤
    function sendQACard() {
      const question = document.getElementById('qaQuestion').value.trim();
      const optionsText = document.getElementById('qaOptions').value.trim();

      if (!question || !optionsText) {
        alert('請輸入題目與至少一個選項！');
        return;
      }

      const options = optionsText.split('\n').map(o => o.trim()).filter(o => o.length > 0);
      if (options.length === 0) {
        alert('請輸入有效的選項！');
        return;
      }

      const cardId = 'qa_' + Date.now();
      const now = new Date();

      // 在聊天室建立卡片
      const container = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message user';
      
      msgDiv.innerHTML = `
        <div class="qa-card" id="${cardId}">
          <div class="qa-card-title">❓ 請回答：${escapeHTML(question)}</div>
          <div class="qa-card-content">選項 (${options.length} 個)：<br>${options.map(o => '• ' + escapeHTML(o)).join('<br>')}</div>
          <button class="qa-card-btn" onclick="drawQA('${cardId}', ${JSON.stringify(options).replace(/"/g, '&quot;')})">🎲 開始隨機抽籤</button>
          <div class="qa-result" id="result_${cardId}" style="display:none;"></div>
        </div>
        <div class="msg-time">${formatTime(now)}</div>
      `;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;

      // 紀錄到資料
      messageList.push({ sender: 'user', text: `[請回答卡片] ${question}`, timestamp: now });

      // 清空並關閉 Modal
      document.getElementById('qaQuestion').value = '';
      document.getElementById('qaOptions').value = '';
      closeModal('advancedModal');
    }

    // 抽籤執行邏輯
    function drawQA(cardId, options) {
      const btn = document.querySelector(`#${cardId} .qa-card-btn`);
      const resultDiv = document.getElementById(`result_${cardId}`);
      
      btn.disabled = true;
      btn.innerText = '抽籤中...';

      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * options.length);
        const selected = options[randomIndex];
        
        btn.style.display = 'none';
        resultDiv.style.display = 'block';
        resultDiv.innerText = `🎯 抽籤結果：${selected}`;

        // 夢角自動回應抽籤結果
        const botTime = new Date();
        const botMsg = `關於「${document.querySelector(`#${cardId} .qa-card-title`).innerText.replace('❓ 請回答：','')}」，我抽到的結果是：【${selected}】！`;
        addMessageToUI('bot', botMsg, botTime);
        messageList.push({ sender: 'bot', text: botMsg, timestamp: botTime });
      }, 800);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
